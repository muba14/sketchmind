<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sketchmind — Önizleme</title>
<style>
:root{--bg:#1B1B22;--surface:#23232C;--card:#2A2A35;--bar:#342B5C;--border:#3A3A48;--accent:#8B6CF6;--soft:#B7A4FF;--text:#DCDDE3;--muted:#8C8C9E;--hl:#6B5A14;--hlText:#F7E9A6;--sep:#E5737D;--code:#33333F;--codeText:#F0A6CA;--tag:#7FD1B9;--done:#5BC97C;--missing:#7C6DAF;--star:#F5C542}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d0d11;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text)}
body{display:flex;align-items:center;justify-content:center}
#phone{width:400px;height:min(860px,calc(100vh - 24px));background:var(--bg);border-radius:28px;overflow:hidden;position:relative;box-shadow:0 20px 60px #000a;border:1px solid #2c2c36}
@media (max-width:520px){#phone{width:100vw;height:100vh;border-radius:0;border:0}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.appbar{height:56px;display:flex;align-items:center;padding:0 6px 0 4px;gap:2px;flex-shrink:0}
.appbar h1{font-size:21px;font-weight:700;margin:0 0 0 8px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .sub{font-size:15px;color:var(--muted);font-weight:500}
.ib{width:42px;height:42px;border:0;background:none;color:var(--text);border-radius:50%;display:grid;place-items:center;cursor:pointer;flex-shrink:0;padding:0}
.ib:hover{background:#ffffff14}.ib:disabled{opacity:.3;cursor:default;background:none}
.ib.sel{background:#8B6CF640;color:var(--soft)}
svg.i{width:22px;height:22px;fill:currentColor;display:block}
.body{flex:1;overflow:auto;position:relative}
.body::-webkit-scrollbar{width:0}
.chips{display:flex;gap:8px;padding:6px 12px 8px;overflow-x:auto;flex-shrink:0}
.chip{display:flex;align-items:center;gap:6px;border:0;border-radius:999px;background:var(--card);color:var(--text);padding:7px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip svg{width:16px;height:16px;fill:var(--muted)}
.chip.on{background:var(--accent);color:#fff}.chip.on svg{fill:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 12px 100px}
.card{background:var(--card);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;aspect-ratio:.68;cursor:pointer;position:relative;user-select:none}
.card:active{transform:scale(.98)}
.prev{flex:1;position:relative;overflow:hidden;background:var(--surface)}
.prev canvas{width:100%;display:block}
.prev .md{transform:scale(.6);transform-origin:top left;width:166.6%;padding:20px 20px 0;pointer-events:none}
.card .fav{position:absolute;top:4px;right:4px;width:40px;height:40px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.card .fav.on{color:var(--star)}.card .fav svg{width:26px;height:26px}
.card .pinned{position:absolute;top:10px;left:10px;color:var(--soft)}.card .pinned svg{width:18px;height:18px}
.cbar{background:var(--bar);padding:8px 12px 10px}
.cbar .t{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;color:#fff;white-space:nowrap;overflow:hidden}
.cbar .t span{overflow:hidden;text-overflow:ellipsis}.cbar .t svg{width:14px;height:14px;fill:var(--soft);flex-shrink:0}
.cbar .t.untitled span{font-style:italic}
.cbar .d{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fab{position:absolute;right:16px;bottom:16px;width:58px;height:58px;border-radius:18px;background:var(--accent);color:#fff;border:0;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 16px #0008;z-index:5}
.fab svg{width:30px;height:30px}
.nav{height:66px;background:var(--surface);display:flex;flex-shrink:0}
.nav button{flex:1;border:0;background:none;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;cursor:pointer}
.nav .pill{width:60px;height:30px;border-radius:15px;display:grid;place-items:center}
.nav .on .pill{background:#8B6CF640}
.tabsbtn{width:26px;height:26px;border:2px solid var(--text);border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:800}
/* markdown */
.md{font-size:15px;line-height:1.45}
.md p{margin:2px 0}.md .gap{height:8px}
.md h1,.md h2,.md h3,.md h4{margin:10px 0 4px;line-height:1.3;font-weight:800;color:#fff}
.md h1{font-size:25px}.md h2{font-size:21px}.md h3{font-size:18.5px;color:var(--text)}.md h4{font-size:16.5px;color:var(--text)}
.md .task{display:flex;gap:10px;align-items:flex-start;margin:4px 0}
.md .box{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--muted);flex-shrink:0;margin-top:2px;display:grid;place-items:center;cursor:pointer}
.md .box.done{background:var(--done);border-color:var(--done)}.md .box svg{width:14px;height:14px;fill:var(--bg)}
.md .task.done .tt{color:var(--muted);text-decoration:line-through}
.md .li{display:flex;margin:2px 0 2px 6px}.md .li .m{width:20px;color:var(--soft);flex-shrink:0}
.md blockquote{margin:4px 0;padding:6px 8px 6px 12px;border-left:3px solid var(--accent);background:#8B6CF614;font-style:italic}
.md pre{background:var(--code);color:var(--codeText);padding:12px;border-radius:8px;font-size:13.5px;overflow-x:auto;margin:6px 0}
.md code{background:var(--code);color:var(--codeText);font-size:.9em;padding:0 3px;border-radius:3px;font-family:ui-monospace,Menlo,Consolas,monospace}
.md mark{background:var(--hl);color:var(--hlText);padding:0 1px}
.md .wl{color:var(--soft);text-decoration:underline;text-decoration-color:#B7A4FF80;cursor:pointer}
.md .wl.miss{color:var(--missing);text-decoration-color:#7C6DAF80}
.md .tag{color:var(--tag);background:#7FD1B91F;border-radius:3px;padding:0 2px;cursor:pointer}
.md .rule{border-top:1.6px dashed var(--sep);margin:10px 0}
.md .lrule{display:flex;align-items:center;gap:8px;color:var(--sep);font-weight:600;margin:6px 0}
.md .lrule::after{content:"";flex:1;border-top:1.6px dashed var(--sep)}
/* not ekranı */
.reader{padding:4px 20px 40px}
.reader .title{font-size:28px;font-weight:800;color:#fff;margin:0}
.reader .title.untitled{color:var(--muted);font-style:italic}
.meta{color:var(--muted);font-size:12px;margin:4px 0 16px}
.empty{color:var(--muted);padding:24px 0;cursor:pointer}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:24px}
.tagchip{background:#7FD1B91a;color:var(--tag);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
.links{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 0;margin-top:12px}
.links .h{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:13px;padding:4px 14px 6px}
.links .h svg{width:16px;height:16px;fill:var(--muted)}
.links .row{display:flex;align-items:center;gap:14px;padding:8px 16px;cursor:pointer;font-size:14px}
.links .row:hover{background:#ffffff0a}.links .row svg{width:20px;height:20px;fill:var(--soft)}
.links .row.miss{color:var(--missing)}.links .row.miss svg{fill:var(--missing)}
.links .row small{display:block;color:var(--muted);font-size:11px}
.links .none{color:var(--muted);font-size:13px;padding:0 14px 6px}
.editor{flex:1;overflow:auto;padding:0 16px 24px;display:flex;flex-direction:column}
.editor input{background:none;border:0;outline:0;color:#fff;font-size:26px;font-weight:800;padding:8px 0;font-family:inherit}
.editor textarea{flex:1;min-height:340px;background:none;border:0;outline:0;resize:none;color:var(--text);font:15px/1.5 ui-monospace,Menlo,Consolas,monospace}
::placeholder{color:var(--muted)}
.sugg{display:flex;gap:8px;padding:6px 8px;background:var(--card);overflow-x:auto;flex-shrink:0}
.sugg button{display:flex;gap:4px;align-items:center;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.sugg svg{width:16px;height:16px;fill:var(--soft)}
.toolbar{display:flex;overflow-x:auto;background:var(--surface);flex-shrink:0;height:50px;align-items:center}
.toolbar::-webkit-scrollbar{height:0}
/* el yazısı */
.stools{display:flex;align-items:center;background:var(--surface);padding:4px 8px;overflow-x:auto;flex-shrink:0;gap:2px}
.stools::-webkit-scrollbar{height:0}
.vsep{width:1px;height:28px;background:var(--border);margin:0 8px;flex-shrink:0}
.dot{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);margin:0 4px;cursor:pointer;flex-shrink:0}
.dot.on{border:3px solid var(--soft)}
.stage{flex:1;overflow:hidden;background:#141419;position:relative;touch-action:none}
.stage canvas{position:absolute;left:0;top:0;box-shadow:0 0 12px #0008;transform-origin:0 0}
/* alt sayfa, menü */
.scrim{position:absolute;inset:0;background:#0009;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.sheet{background:var(--surface);border-radius:24px 24px 0 0;padding:10px 0 16px;max-height:75%;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet .handle{width:32px;height:4px;border-radius:2px;background:var(--muted);margin:4px auto 14px}
.sheet .st{font-weight:700;font-size:16px;padding:0 20px 10px}
.sheet .opt{display:flex;align-items:center;gap:16px;padding:12px 24px;cursor:pointer;font-size:15px}
.sheet .opt:hover{background:#ffffff0a}.sheet .opt svg{width:22px;height:22px;fill:currentColor}
.sheet .opt.danger{color:var(--sep)}
.newopts{display:flex;gap:12px;padding:0 16px}
.newopt{flex:1;background:var(--card);border-radius:16px;padding:16px;cursor:pointer}
.newopt .ic{width:44px;height:44px;border-radius:12px;background:#8B6CF633;display:grid;place-items:center;color:var(--soft);margin-bottom:12px}
.newopt b{display:block;font-size:16px}.newopt small{color:var(--muted);font-size:12px}
.drawer{position:absolute;inset:0 auto 0 0;width:300px;background:var(--surface);z-index:21;overflow:auto;padding:16px 8px;animation:right .18s ease-out}
@keyframes right{from{transform:translateX(-40px);opacity:.4}}
.drawer .brand{display:flex;align-items:center;gap:12px;padding:4px 12px 12px;font-size:22px;font-weight:800}
.drawer .brand img{width:40px;height:40px;border-radius:10px}
.drawer .it{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:10px;cursor:pointer;font-size:14px}
.drawer .it svg{width:20px;height:20px;fill:currentColor}
.drawer .it span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.drawer .it i{color:var(--muted);font-style:normal}
.drawer .it.on{background:#8B6CF62e;color:var(--soft)}
.drawer .hd{display:flex;align-items:center;color:var(--muted);font-size:11px;letter-spacing:1.2px;font-weight:700;padding:18px 8px 4px 16px}
.drawer .hd span{flex:1}.drawer .hint{color:var(--muted);font-size:13px;padding:4px 16px}
.menu{position:absolute;right:8px;top:48px;background:var(--surface);border-radius:8px;box-shadow:0 8px 24px #000a;z-index:22;min-width:210px;padding:6px 0}
.menu div{padding:12px 16px;cursor:pointer;font-size:14px;display:flex;gap:10px;align-items:center}
.menu div:hover{background:#ffffff0d}.menu svg{width:18px;height:18px;fill:var(--accent)}.menu .sp{width:18px}
.dialog{position:absolute;inset:0;background:#0009;z-index:30;display:grid;place-items:center}
.dialog .box{background:var(--surface);border-radius:24px;padding:22px;width:86%}
.dialog h3{margin:0 0 14px;font-size:20px}.dialog p{color:var(--text);margin:0 0 8px}
.dialog input{width:100%;background:var(--card);border:0;border-radius:12px;padding:14px;color:var(--text);font-size:15px;outline:0}
.dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.btn{border:0;border-radius:20px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:14px;background:none;color:var(--soft)}
.btn.fill{background:var(--accent);color:#fff}.btn.red{background:var(--sep);color:#fff}
.slider{width:calc(100% - 40px);margin:6px 20px;accent-color:var(--accent)}
.papers{display:flex;gap:10px;padding:0 20px;overflow-x:auto}
.papers .p{text-align:center;font-size:12px;cursor:pointer}
.papers canvas{width:70px;height:99px;border-radius:6px;border:1px solid var(--border);display:block;margin-bottom:4px}
.papers .p.on canvas{border:3px solid var(--accent)}
.pcolors{display:flex;gap:12px;padding:0 20px}
.pcolors div{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--border);cursor:pointer}
.pcolors .on{border:3px solid var(--accent)}
.graphchips{position:absolute;left:12px;top:8px;display:flex;gap:8px;z-index:2}
.gpanel{position:absolute;left:12px;right:12px;bottom:12px;background:var(--surface);border-radius:16px;box-shadow:0 6px 18px #0009;display:flex;align-items:center;gap:14px;padding:12px 16px;z-index:2}
.gpanel svg{width:24px;height:24px;fill:var(--soft)}
.gpanel div{flex:1;min-width:0}.gpanel b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gpanel small{color:var(--muted)}
#graph{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.search{padding:0 16px 8px;position:relative}
.search input{width:100%;background:var(--card);border:0;border-radius:12px;padding:14px 14px 14px 44px;color:var(--text);font-size:15px;outline:0}
.search svg{position:absolute;left:30px;top:13px;fill:var(--muted)}
.res{display:flex;gap:14px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.res:hover{background:#ffffff08}.res svg{fill:var(--soft);flex-shrink:0;margin-top:2px}
.res b{font-weight:600}.res .sn{color:var(--muted);font-size:13px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.res mark{background:var(--hl);color:var(--hlText)}
.center{display:grid;place-items:center;height:70%;color:var(--muted);text-align:center;padding:24px}
.tabsgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}
.tabc{cursor:pointer}
.tabc .tb{position:relative;aspect-ratio:.72;background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden}
.tabc .tb.on{border:2.5px solid var(--accent)}
.tabc .tb .prev{position:absolute;inset:34px 0 0 0}
.tabc .x{position:absolute;right:2px;top:0}
.tabc .pn{position:absolute;left:10px;top:9px;color:var(--soft)}.tabc .pn svg{width:18px;height:18px}
.tabc .nm{text-align:center;font-size:13px;font-weight:600;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabsbar{display:flex;align-items:center;padding:4px 16px 10px 8px;flex-shrink:0}
.tabsbar .c{flex:1;text-align:center;font-weight:600;font-size:16px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#3b3b48;padding:10px 16px;border-radius:10px;font-size:13px;z-index:40;white-space:nowrap}
.lockprev{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:12px}
.lockprev svg{width:36px;height:36px;fill:var(--soft)}
.lockbig{width:84px;height:84px;border-radius:50%;background:#8B6CF626;display:grid;place-items:center;margin:0 auto}.lockbig svg{width:44px;height:44px;fill:var(--soft)}
.btn svg{width:18px;height:18px;fill:currentColor;vertical-align:-4px;margin-right:4px}
.dialog .err{color:var(--sep);font-size:13px;min-height:18px;margin-top:6px;text-align:center}.pinhint{color:var(--muted)!important;font-size:13px}
.embed,.embed-off{margin:8px 0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface);cursor:pointer}
.echip{display:flex;gap:6px;align-items:center;padding:8px 10px;color:var(--soft)}.echip svg{width:16px;height:16px;fill:var(--soft)}
.ecanvas{overflow:hidden;position:relative}.ecanvas canvas{display:block}
.efoot{display:flex;align-items:center;gap:6px;padding:8px 10px;font-size:14px}.efoot b{flex:1}.efoot svg{width:16px;height:16px;fill:var(--soft)}.efoot small{color:var(--muted)}
.etext{padding:10px 14px;max-height:230px;overflow:hidden}.et{display:flex;gap:6px;align-items:center;font-weight:700;margin-bottom:6px}.et svg{width:16px;height:16px;fill:var(--soft)}
.einfo{display:flex;align-items:center;gap:12px;padding:14px}.einfo svg{width:24px;height:24px;fill:var(--soft)}.einfo b{display:block;color:var(--soft)}.einfo small{color:var(--muted);font-size:12px}
.einfo.miss b{color:var(--missing)}.einfo.miss svg{fill:var(--missing)}
.selbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--surface);border-radius:24px;box-shadow:0 6px 18px #000a;display:flex;align-items:center;padding:0 6px;z-index:3}
.selbar span{color:var(--muted);font-size:13px;padding:0 10px}
.progress{position:absolute;inset:0;background:#0009;display:grid;place-items:center;z-index:4}.progress div{background:var(--surface);border-radius:16px;padding:20px;width:240px;text-align:center}
.progress i{display:block;height:4px;background:var(--border);border-radius:2px;margin-top:14px;overflow:hidden}.progress i b{display:block;height:100%;background:var(--accent);width:0}
.info{margin:0 16px 8px;padding:12px;background:var(--card);border-radius:12px;color:var(--muted);font-size:13px}
.trow{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer}.trow:hover{background:#ffffff08}.trow svg{fill:var(--muted)}
.trow div{flex:1}.trow small{display:block;font-size:12px;color:var(--muted)}.trow small.soon{color:var(--sep)}
.sh{color:var(--muted);font-size:11px;letter-spacing:1.2px;font-weight:700;padding:20px 20px 6px}
.srow{display:flex;align-items:center;gap:16px;padding:12px 20px;cursor:pointer}.srow:hover{background:#ffffff08}.srow svg{fill:var(--text);flex-shrink:0}
.srow div{flex:1}.srow small{display:block;color:var(--muted);font-size:12px}.srow.off{opacity:.5;cursor:default}
.toast{display:flex;align-items:center;gap:12px}.toast button{background:none;border:0;color:var(--soft);font-weight:700;cursor:pointer;font-size:13px}
</style>
</head>
<body>

function openNote(n, edit = false) {
  if (n.locked && !unlocked) return ensureUnlocked(() => openNote(n, edit));
  openTab(n.id); push({name: n.type === 'text' ? 'text' : 'sketch', id: n.id, edit}); }
function openOrCreate(title) { const n = byTitle(title); if (n) openNote(n); else openNote(createText(title.trim()), true); }
function toast(msg, action, fn) { phone.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  if (action) { const b = document.createElement('button'); b.textContent = action; b.onclick = () => { t.remove(); fn(); }; t.appendChild(b); }
  phone.appendChild(t); setTimeout(() => t.remove(), action ? 4000 : 2200); }

// ---- kilit (PIN; uygulamada ayrıca parmak izi)
async function sha(txt) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
function pinDialog(create, done) {
  let first = null;
  const d = layer(`<div class="box"><div style="text-align:center;color:var(--soft)">${ic('lock')}</div><h3 style="text-align:center"></h3><p class="pinhint"></p>
    <input type="password" inputmode="numeric" maxlength="8" style="text-align:center;font-size:24px;letter-spacing:10px"><div class="err"></div>
    <div class="acts"><button class="btn" data-x>Vazgeç</button><button class="btn fill" data-ok></button></div></div>`, 'dialog');
  const h = d.querySelector('h3'), inp = d.querySelector('input'), err = d.querySelector('.err'), ok = d.querySelector('[data-ok]'), hint = d.querySelector('.pinhint');
  const ui = () => { h.textContent = !create ? 'PIN gir' : first === null ? 'Yeni PIN belirle' : "PIN'i tekrar gir"; ok.textContent = create ? 'Devam' : 'Aç';
    hint.textContent = create && first === null ? 'Kilitli notları açmak için kullanılır. Uygulamada parmak izi de kullanılabilir.' : ''; };
  ui(); setTimeout(() => inp.focus(), 30);
  inp.oninput = () => { inp.value = inp.value.replace(/\D/g, ''); };
  const submit = async () => {
    const pin = inp.value; if (pin.length < 4) { err.textContent = 'PIN en az 4 haneli olmalı'; return; }
    if (!create) { if (await sha(S.security.salt + ':' + pin) === S.security.pinHash) { d.remove(); unlocked = true; done(true); } else { inp.value = ''; err.textContent = 'Yanlış PIN'; } return; }
    if (first === null) { first = pin; inp.value = ''; err.textContent = ''; ui(); }
    else if (first === pin) { S.security.salt = uid(); S.security.pinHash = await sha(S.security.salt + ':' + pin); save(); unlocked = true; d.remove(); done(true); }
    else { first = null; inp.value = ''; err.textContent = "PIN'ler eşleşmedi, baştan dene"; ui(); }
  };
  ok.onclick = submit; inp.onkeydown = e => { if (e.key === 'Enter') submit(); };
  d.querySelector('[data-x]').onclick = () => { d.remove(); done(false); };
}
function ensureUnlocked(then) { if (unlocked) return then(); pinDialog(!S.security.pinHash, ok => { if (ok) then(); }); }
function toggleLock(n) {
  if (!n.locked) ensureUnlocked(() => { n.locked = true; save(); render(); toast('Not kilitlendi 🔒'); });
  else ensureUnlocked(() => { n.locked = false; save(); render(); toast('Kilit kaldırıldı'); });
}
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => { if (document.hidden) hiddenAt = Date.now();
  else if (hiddenAt && Date.now() - hiddenAt > 60000 && unlocked) { unlocked = false; render(); } });

// ---- çöp kutusu
function moveToTrash(n, after) {
  n.deletedAt = Date.now(); n.pinned = false; S.tabs = S.tabs.filter(t => t !== n.id); save();
  if (after) after(); else render();
  toast(`"${disp(n)}" çöp kutusuna taşındı`, 'Geri al', () => { delete n.deletedAt; save(); render(); });
}

function render() {
  const r = curRoute();
  phone.innerHTML = '';
  const el = document.createElement('div'); el.className = 'screen'; phone.appendChild(el);
  ({home: renderHome, text: renderText, sketch: renderSketchScreen, tabs: renderTabs, filtered: renderNotesPage, trash: renderTrash, settings: renderSettings})[r.name](el, r);
}

// ------------------------------------------------------------------ ana ekran
function filterTitle(f) { return f.k === 'all' ? 'Son Notlar' : f.k === 'fav' ? 'Favoriler' : f.k === 'folder' ? f.v : '#' + f.v; }
function matches(f, n) { return f.k === 'all' || (f.k === 'fav' && n.favorite) || (f.k === 'folder' && n.folder === f.v) || (f.k === 'tag' && tagsOf(n).includes(f.v)); }

function renderHome(el) {
  const content = document.createElement('div'); content.style.cssText = 'flex:1;position:relative;display:flex;flex-direction:column;min-height:0';
  el.appendChild(content);
  if (home.tab === 'notes') renderNotesPage(content, {filter: home.filter, standalone: false});
  else if (home.tab === 'graph') renderGraph(content);
  else renderSearch(content);
  const nav = document.createElement('div'); nav.className = 'nav';
  nav.innerHTML = [['notes', 'grid', 'Notlar'], ['graph', 'hub', 'Grafik'], ['search', 'search', 'Ara']].map(([k, i, l]) =>
    `<button data-tab="${k}" class="${home.tab === k ? 'on' : ''}"><span class="pill">${ic(i)}</span>${l}</button>`).join('');
  nav.onclick = e => { const b = e.target.closest('button'); if (b) { if (curRoute().cleanup) curRoute().cleanup(); home.tab = b.dataset.tab; render(); } };
  el.appendChild(nav);
}

function renderNotesPage(el, r) {
  const standalone = r.name === 'filtered';
  const f = standalone ? r.filter : home.filter;
  const typeKey = standalone ? (r.type || 'all') : home.type;
  const list = sorted(live().filter(n => matches(f, n) && (typeKey === 'all' || n.type === typeKey)));
  el.innerHTML = `
    <div class="appbar">
      <button class="ib" data-a="${standalone ? 'back' : 'drawer'}">${ic(standalone ? 'back' : 'menu')}</button>
      <h1>${esc(filterTitle(f))}</h1>
      <button class="ib" data-a="tabs" title="Açık sekmeler"><span class="tabsbtn">${S.tabs.filter(byId).length}</span></button>
      <button class="ib" data-a="sort" title="Sırala">${ic('sort')}</button>
    </div>
    <div class="chips">${[['all', 'apps', 'Tümü'], ['text', 'notes', 'Metin'], ['sketch', 'draw', 'El yazısı']].map(([k, i, l]) =>
      `<button class="chip ${typeKey === k ? 'on' : ''}" data-type="${k}">${ic(i)}${l}</button>`).join('')}</div>
    <div class="body">${list.length ? `<div class="grid">${list.map(cardHtml).join('')}</div>` :
      `<div class="center"><div>${ic('book').replace('class="i ', 'style="width:64px;height:64px;fill:#8B6CF699" class="i ')}<p style="color:var(--text);font-weight:600;font-size:17px;margin:12px 0 6px">Burada henüz not yok</p>Sağ alttaki + ile metin ya da el yazısı notu oluştur.</div></div>`}</div>
    <button class="fab" data-a="new">${ic('add')}</button>`;
  paintThumbs(el);
  el.onclick = e => {
    const a = e.target.closest('[data-a]')?.dataset.a;
    const t = e.target.closest('[data-type]');
    const favB = e.target.closest('.fav');
    const card = e.target.closest('.card');
    if (a === 'back') return pop();
    if (a === 'drawer') return showDrawer();
    if (a === 'tabs') return push({name: 'tabs'});
    if (a === 'sort') return showMenu(e.target.closest('.ib'), [['updated', 'Son düzenlenen'], ['created', 'Oluşturulma tarihi'], ['title', 'Başlık (A-Z)']].map(([k, l]) => [l, () => { S.sort = k; save(); render(); }, S.sort === k]));
    if (a === 'new') return newNoteSheet(f.k === 'folder' ? f.v : '');
    if (t) { if (standalone) r.type = t.dataset.type; else home.type = t.dataset.type; return render(); }
    if (favB) { const n = byId(card.dataset.id); n.favorite = !n.favorite; save(); return render(); }
    if (card) openNote(byId(card.dataset.id));
  };
  attachLongPress(el, '.card', c => noteActions(byId(c.dataset.id)));
}

function cardHtml(n) {
  return `<div class="card" data-id="${n.id}">
    <div class="prev">${previewHtml(n)}
      <button class="fav ${n.favorite ? 'on' : ''}">${ic(n.favorite ? 'star' : 'star_o')}</button>
</div>
    <div class="cbar"><div class="t ${(n.title || '').trim() ? '' : 'untitled'}">${n.pinned ? ic('pin') : ''}${ic(n.type === 'sketch' ? 'draw' : 'notes')}<span>${esc(disp(n))}</span></div>
    <div class="d">${fmt(n.updated)}${n.folder ? ' · ' + esc(n.folder) : ''}</div></div></div>`;
}
function previewHtml(n) {
  if (n.locked) return `<div class="lockprev">${ic('lock')}<span>Kilitli</span></div>`;
  if (n.type === 'sketch') return `<canvas data-thumb="${n.id}"></canvas>`;
  const src = n.content.slice(0, 900);
  return src.trim() ? `<div class="md">${md(src)}</div>` : '<div style="padding:12px;color:var(--muted);font-size:11px">Boş not</div>';
}
function paintThumbs(root) {
  requestAnimationFrame(() => root.querySelectorAll('canvas[data-thumb]').forEach(c => {
    const n = byId(c.dataset.thumb); if (n) renderSketch(c, n, c.parentElement.clientWidth || 170, 1);
  }));
}
function attachLongPress(root, sel, fn) {
  let t, target, fired = false;
  root.addEventListener('pointerdown', e => { target = e.target.closest(sel); if (!target || e.target.closest('.fav,.x')) return; fired = false; t = setTimeout(() => { fired = true; fn(target); }, 500); });
  ['pointerup', 'pointerleave', 'pointercancel', 'pointermove'].forEach(ev => root.addEventListener(ev, e => { if (ev === 'pointermove' && Math.abs(e.movementX) + Math.abs(e.movementY) < 4) return; clearTimeout(t); }));
  root.addEventListener('click', e => { if (fired) { e.stopImmediatePropagation(); fired = false; } }, true);
  root.addEventListener('contextmenu', e => { const c = e.target.closest(sel); if (c) { e.preventDefault(); clearTimeout(t); fn(c); } });
}

// ------------------------------------------------------------------ katmanlar
function layer(html, cls = 'scrim') { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; phone.appendChild(d); return d; }
function sheet(inner) { const s = layer(`<div class="sheet"><div class="handle"></div>${inner}</div>`); s.onclick = e => { if (e.target === s) s.remove(); }; return s; }
function showMenu(anchor, items) {
  const bg = layer('', 'scrim'); bg.style.background = 'transparent';
  const m = document.createElement('div'); m.className = 'menu';
  m.innerHTML = items.map(([l, , chk], i) => `<div data-i="${i}">${chk === undefined ? '' : chk ? ic('check') : '<span class="sp"></span>'}${esc(l)}</div>`).join('');
  bg.appendChild(m);
  bg.onclick = e => { const it = e.target.closest('[data-i]'); bg.remove(); if (it) items[+it.dataset.i][1](); };
}
function prompt2(title, initial, hint, cb) {
  const d = layer(`<div class="box"><h3>${esc(title)}</h3><input value="${esc(initial || '')}" placeholder="${esc(hint || '')}"><div class="acts"><button class="btn" data-x>Vazgeç</button><button class="btn fill" data-ok>Kaydet</button></div></div>`, 'dialog');
  const inp = d.querySelector('input'); setTimeout(() => { inp.focus(); inp.select(); }, 30);
  const ok = () => { d.remove(); cb(inp.value.trim()); };
  inp.onkeydown = e => { if (e.key === 'Enter') ok(); if (e.key === 'Escape') d.remove(); };
  d.querySelector('[data-ok]').onclick = ok; d.querySelector('[data-x]').onclick = () => d.remove();
}
function confirm2(title, msg, cb) {
  const d = layer(`<div class="box"><h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="acts"><button class="btn" data-x>Vazgeç</button><button class="btn red" data-ok>Sil</button></div></div>`, 'dialog');
  d.querySelector('[data-ok]').onclick = () => { d.remove(); cb(); }; d.querySelector('[data-x]').onclick = () => d.remove();
}
function newNoteSheet(folder = '') {
  const s = sheet(`<div class="newopts"><div class="newopt" data-k="text"><div class="ic">${ic('notes')}</div><b>Metin notu</b><small>Markdown, [[bağlantı]], görevler</small></div>
    <div class="newopt" data-k="sketch"><div class="ic">${ic('draw')}</div><b>El yazısı</b><small>Kalem, fosforlu, silgi</small></div></div>`);
  s.querySelectorAll('.newopt').forEach(o => o.onclick = () => { s.remove(); if (o.dataset.k === 'text') openNote(createText('', folder), true); else openNote(createSketch(folder)); });
}
function noteActions(n, onDeleted) {
  const opts = [
    ['fav', n.favorite ? 'star' : 'star_o', n.favorite ? 'Favorilerden çıkar' : 'Favorilere ekle'],
    ['pin', 'pin', n.pinned ? 'Sabitlemeyi kaldır' : 'Üste sabitle'],
    ['rename', 'edit', 'Yeniden adlandır'],
    ['folder', 'folder', n.folder ? 'Klasör: ' + n.folder : 'Klasöre taşı'],
    ['lock', n.locked ? 'lockopen' : 'lock', n.locked ? 'Kilidi kaldır' : 'Kilitle (PIN)'],
    ['dup', 'copy', 'Çoğalt'], ['del', 'delete', 'Çöp kutusuna taşı']];
  const s = sheet(`<div class="st" style="text-align:center">${esc(disp(n))}</div>` + opts.map(([k, i, l]) => `<div class="opt ${k === 'del' ? 'danger' : ''}" data-k="${k}">${ic(i)}${esc(l)}</div>`).join(''));
  s.onclick = e => {
    if (e.target === s) return s.remove();
    const k = e.target.closest('[data-k]')?.dataset.k; if (!k) return; s.remove();
    if (k === 'fav') { n.favorite = !n.favorite; save(); render(); }
    if (k === 'pin') { n.pinned = !n.pinned; save(); render(); }
    if (k === 'rename') prompt2('Yeniden adlandır', n.title, 'Not başlığı', v => { const o = n.title; n.title = v; touch(n); renameLinks(o, v); render(); });
    if (k === 'folder') pickFolder(n.folder, v => { n.folder = v; save(); render(); });
    if (k === 'dup') { S.notes.push({...JSON.parse(JSON.stringify(n)), id: uid(), title: (n.title || '').trim() ? n.title + ' (kopya)' : '', pinned: false, favorite: false, created: Date.now(), updated: Date.now()}); save(); render(); }
    if (k === 'lock') toggleLock(n);
    if (k === 'del') moveToTrash(n, onDeleted);
  };
}
function pickFolder(cur, cb) {
  const s = sheet(`<div class="opt" data-v="__new" style="color:var(--soft)">${ic('newfolder')}Yeni klasör</div>
    <div class="opt" data-v="">${ic('close')}Klasör yok ${cur ? '' : '✓'}</div>` + folders().map(f => `<div class="opt" data-v="${esc(f)}">${ic('folder')}${esc(f)} ${f === cur ? '✓' : ''}</div>`).join(''));
  s.onclick = e => {
    if (e.target === s) return s.remove();
    const o = e.target.closest('[data-v]'); if (!o) return; s.remove();
    if (o.dataset.v === '__new') prompt2('Yeni klasör', '', 'Klasör adı', v => { if (v) { if (!S.folders.includes(v)) S.folders.push(v); cb(v); } });
    else cb(o.dataset.v);
  };
}
function showDrawer() {
  const bg = layer('', 'scrim'); bg.style.justifyContent = 'flex-start';
  const d = document.createElement('div'); d.className = 'drawer';
  const it = (f, icon, label, count) => { const on = JSON.stringify(f) === JSON.stringify(home.filter);
    return `<div class="it ${on ? 'on' : ''}" data-f='${esc(JSON.stringify(f))}'>${ic(icon)}<span>${esc(label)}</span><i>${count}</i></div>`; };
  const fl = folders(), tg = tagCounts();
  d.innerHTML = `<div class="brand"><img src="${ICON_SRC}" alt="">Sketchmind</div>
    ${it({k: 'all'}, 'grid', 'Tüm notlar', live().length)}
    ${it({k: 'fav'}, 'star', 'Favoriler', live().filter(n => n.favorite).length)}
    <div class="hd"><span>KLASÖRLER</span><button class="ib" data-newf style="width:34px;height:34px">${ic('newfolder')}</button></div>
    ${fl.length ? fl.map(f => it({k: 'folder', v: f}, 'folder', f, live().filter(n => n.folder === f).length)).join('') : '<div class="hint">Klasör yok</div>'}
    <div class="hd"><span>ETİKETLER</span></div>
    ${tg.length ? tg.map(([t, c]) => it({k: 'tag', v: t}, 'tag', t, c)).join('') : '<div class="hint">Notlarına #etiket yazınca burada görünür</div>'}
    <div style="border-top:1px solid var(--border);margin:14px 8px"></div>
    <div class="it" data-go="trash">${ic('delete')}<span>Çöp kutusu</span><i>${S.notes.filter(n => n.deletedAt).length}</i></div>
    <div class="it" data-go="settings">${ic('settings')}<span>Ayarlar ve yedekleme</span></div>`;
  bg.appendChild(d);
  bg.onclick = e => {
    if (e.target === bg) return bg.remove();
    if (e.target.closest('[data-newf]')) return prompt2('Yeni klasör', '', 'Klasör adı', v => { if (v && !S.folders.includes(v)) { S.folders.push(v); save(); } bg.remove(); showDrawer(); });
    const go = e.target.closest('[data-go]'); if (go) { bg.remove(); return push({name: go.dataset.go}); }
    const i = e.target.closest('[data-f]'); if (!i) return;
    home.filter = JSON.parse(i.dataset.f); bg.remove(); render();
  };
}

// ------------------------------------------------------------------ metin notu
function renderText(el, r) {
  const n = byId(r.id); if (!n) { el.innerHTML = '<div class="center">Not bulunamadı</div>'; return; }
  if (n.locked && !unlocked) return lockedView(el, n);
  if (r.origTitle === undefined) r.origTitle = n.title;
  r.cleanup = () => { if ((r.origTitle || '').trim() !== (n.title || '').trim()) { renameLinks(r.origTitle, n.title); r.origTitle = n.title; } };
  el.innerHTML = `<div class="appbar">
    <button class="ib" data-a="back">${ic('back')}</button>
    <h1 class="sub">${esc(n.folder || 'Not')}</h1>
    <button class="ib" data-a="fav" style="${n.favorite ? 'color:var(--star)' : ''}">${ic(n.favorite ? 'star' : 'star_o')}</button>
    <button class="ib" data-a="mode" title="${r.edit ? 'Okuma modu' : 'Düzenle'}">${ic(r.edit ? 'book' : 'edit')}</button>
    <button class="ib" data-a="more">${ic('more')}</button></div>`;
  el.querySelector('.appbar').onclick = e => {
    const a = e.target.closest('[data-a]')?.dataset.a;
    if (a === 'back') pop();
    if (a === 'fav') { n.favorite = !n.favorite; save(); render(); }
    if (a === 'mode') { r.cleanup(); r.edit = !r.edit; render(); }
    if (a === 'more') { r.cleanup(); noteActions(n, () => { stack.pop(); render(); }); }
  };
  if (r.edit) return textEditor(el, r, n);

  const bl = backlinks(n), out = linksOf(n), tags = tagsOf(n).sort();
  const body = document.createElement('div'); body.className = 'body';
  const untitled = !(n.title || '').trim();
  body.innerHTML = `<div class="reader">
    <h2 class="title ${untitled ? 'untitled' : ''}">${esc(disp(n))}</h2>
    <div class="meta">Düzenlendi: ${fmt(n.updated)}</div>
    ${n.content.trim() ? `<div class="md">${md(n.content)}</div>` : '<div class="empty" data-a="edit">Bu not boş. Yazmaya başlamak için dokun ya da ✏️ simgesine bas.</div>'}
    ${tags.length ? `<div class="tagrow">${tags.map(t => `<span class="tagchip" data-tag="${esc(t)}">#${esc(t)}</span>`).join('')}</div>` : ''}
    <div style="height:16px"></div>
    <div class="links"><div class="h">${ic('in')}Geri bağlantılar (${bl.length})</div>
      ${bl.length ? bl.map(b => `<div class="row" data-id="${b.id}">${ic(b.type === 'sketch' ? 'draw' : 'paper')}${esc(disp(b))}</div>`).join('') : '<div class="none">Bu nota henüz bağlanan not yok.</div>'}</div>
    <div class="links"><div class="h">${ic('out')}Giden bağlantılar (${out.length})</div>
      ${out.length ? out.map(t => { const x = byTitle(t); return `<div class="row ${x ? '' : 'miss'}" data-link="${esc(t)}">${ic(x ? (x.type === 'sketch' ? 'draw' : 'paper') : 'addc')}<div>${esc(t)}${x ? '' : '<small>Henüz yok — dokununca oluşturulur</small>'}</div></div>`; }).join('') : '<div class="none">Bu not başka bir nota bağlanmıyor.</div>'}</div>
  </div>`;
  el.appendChild(body);
  fillEmbeds(body);
  body.onclick = e => {
    const emb = e.target.closest('.embed[data-embed]');
    if (emb) { const t = emb.dataset.embed, x = byTitle(t); if (x) return openNote(x); return openNote(createSketch(n.folder, t.trim())); }
    const box = e.target.closest('.box[data-line]');
    if (box) { const L = n.content.split('\n'), i = +box.dataset.line, p = L[i].indexOf('[');
      const done = L[i][p + 1].toLowerCase() === 'x'; L[i] = L[i].slice(0, p) + (done ? '[ ]' : '[x]') + L[i].slice(p + 3);
      n.content = L.join('\n'); touch(n); const st = body.scrollTop; render(); phone.querySelector('.body').scrollTop = st; return; }
    const link = e.target.closest('[data-link]'); if (link) return openOrCreate(link.dataset.link);
    const tag = e.target.closest('[data-tag]'); if (tag) return push({name: 'filtered', filter: {k: 'tag', v: tag.dataset.tag}});
    const row = e.target.closest('.row[data-id]'); if (row) return openNote(byId(row.dataset.id));
    if (e.target.closest('[data-a="edit"]')) { r.edit = true; render(); }
  };
}

function lockedView(el, n) {
  el.innerHTML = `<div class="appbar"><button class="ib" data-a="back">${ic('back')}</button></div>
    <div class="center"><div><div class="lockbig">${ic('lock')}</div><h2 style="margin:16px 0 6px;color:var(--text)">${esc(disp(n))}</h2>Bu not kilitli<br><br>
    <button class="btn fill" data-a="unlock">${ic('finger')} Kilidi aç</button></div></div>`;
  el.onclick = e => { const a = e.target.closest('[data-a]')?.dataset.a; if (a === 'back') pop(); if (a === 'unlock') ensureUnlocked(render); };
}

/// ![[Not]] gömmelerini doldurur: çizim → sayfanın dolu kısmı, metin → kısa önizleme
function fillEmbeds(root) {
  root.querySelectorAll('.embed[data-embed]').forEach(box => {
    const t = box.dataset.embed, n = byTitle(t);
    if (!n) { box.innerHTML = `<div class="einfo miss">${ic('addc')}<div><b>"${esc(t)}" henüz yok</b><small>Dokun, bu adla bir çizim sayfası oluştur</small></div></div>`; return; }
    if (n.locked && !unlocked) { box.innerHTML = `<div class="einfo">${ic('lock')}<div><b>${esc(disp(n))}</b><small>Kilitli not</small></div></div>`; return; }

function fromAppNote(j) {
  const pairs = a => { const o = []; for (let i = 0; i + 1 < a.length; i += 2) o.push([a[i], a[i + 1]]); return o; };
  const n = {id: j.id, type: j.type === 'sketch' ? 'sketch' : 'text', title: j.title || '', content: j.content || '',
    strokes: (j.strokes || []).map(s => ({c: intHex(s.c), w: s.w, ...(s.h ? {h: true} : {}), ...(s.s ? {s: true} : {}), p: pairs(s.p)})),
    images: (j.images || []).map(i => ({id: i.id, m: i.m, r: i.r, ...(i.bg ? {bg: true} : {})})),
    paper: j.paper || 'blank', paperColor: intHex(j.paperColor ?? 0xFFFFFFFF), pages: j.pages || 1, folder: j.folder || '',
    favorite: !!j.favorite, pinned: !!j.pinned, created: Date.parse(j.created) || Date.now(), updated: Date.parse(j.updated) || Date.now()};
  if (j.locked) n.locked = true; if (j.deletedAt) n.deletedAt = Date.parse(j.deletedAt);
  return n;
}
const stamp = () => new Date().toISOString().slice(0, 10);
async function downloadFile(name, data) {
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) { try { await dl.save({filename: name, data}); toast('Dosya kaydedildi'); } catch (e) { if (e && e.code !== 'declined') toast('İndirilemedi: ' + (e.message || e.code)); } return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(data instanceof Blob ? data : new Blob([data])); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); toast('Dosya indirildi');
}
async function exportBackup() {
  const media = {}; S.notes.forEach(n => (n.images || []).forEach(i => { if (S.media[i.m]) media[i.m] = S.media[i.m].split(',')[1]; }));
  const data = {app: 'sketchmind', exported: new Date().toISOString(), version: 2, sort: S.sort, folders: S.folders, tabs: [], notes: S.notes.map(toAppNote), media};
  await downloadFile(`sketchmind-yedek-${stamp()}.json`, JSON.stringify(data));
}
async function importBackup(file) {
  try {
    const raw = JSON.parse(await file.text());
    if (raw.app !== 'sketchmind') throw new Error('Bu dosya bir Sketchmind yedeği değil');
    Object.entries(raw.media || {}).forEach(([k, v]) => { if (!S.media[k]) S.media[k] = 'data:image/jpeg;base64,' + v; });
    let c = 0; (raw.notes || []).forEach(j => { const n = fromAppNote(j); S.notes = S.notes.filter(x => x.id !== n.id); S.notes.push(n); c++; });
    (raw.folders || []).forEach(f => { if (!S.folders.includes(f)) S.folders.push(f); });
    save(); render(); toast(`${c} not geri yüklendi`);
  } catch (e) { toast('Yedek okunamadı: ' + e.message); }
}
async function sketchBlob(n) {
  for (const im of n.images || []) await new Promise(res => { if (getImg(im.m)) return res(); whenImg(im.m, res); setTimeout(res, 3000); });
  const w = 1200, H = PH * (n.pages || 1), c = document.createElement('canvas'); c.width = w; c.height = Math.round(w * H / PW);
  const ctx = c.getContext('2d'); ctx.setTransform(w / PW, 0, 0, w / PW, 0, 0);
  drawPaper(ctx, n.paper || 'blank', n.paperColor || '#FFFFFF', n.pages || 1, H);
  (n.images || []).forEach(im => { const i = getImg(im.m); if (i) ctx.drawImage(i, ...im.r); });
  (n.strokes || []).forEach(s => drawStroke(ctx, s));
  return new Promise(res => c.toBlob(res, 'image/png'));
}
let jszipPromise = null;
const loadJSZip = () => jszipPromise || (jszipPromise = new Promise((res, rej) => { const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; s.onload = () => res(window.JSZip); s.onerror = e => { jszipPromise = null; rej(e); }; document.head.appendChild(s); }));
async function exportMarkdown() {
  const JSZip = await loadJSZip(), zip = new JSZip(), used = new Set(), sketchFile = {};
  const safe = t => (t || '').replace(/[\\/:*?"<>|#^\[\]]/g, '-').trim() || 'Başlıksız Not';
  const path = (folder, base, ext) => { const dir = folder ? safe(folder) + '/' : ''; let nm = base, i = 2; while (used.has((dir + nm + '.' + ext).toLowerCase())) nm = `${base} (${i++})`; used.add((dir + nm + '.' + ext).toLowerCase()); return dir + nm + '.' + ext; };
  for (const n of live().filter(n => n.type === 'sketch')) { const p = path(n.folder, safe(disp(n)), 'png'); zip.file(p, await sketchBlob(n)); if ((n.title || '').trim()) sketchFile[n.title.trim().toLowerCase()] = p.split('/').pop(); }
  for (const n of live().filter(n => n.type === 'text')) {
    const body = n.content.replace(LINK_RE, (whole, t, alias) => { const f = sketchFile[t.trim().toLowerCase()]; return f ? (alias ? `[[${f}|${alias}]]` : `[[${f}]]`) : whole; });
    zip.file(path(n.folder, safe(disp(n)), 'md'), body);
  }
  await downloadFile(`sketchmind-markdown-${stamp()}.zip`, await zip.generateAsync({type: 'blob'}));
}

// ------------------------------------------------------------------ ayarlar
function renderSettings(el) {
  const hasPin = !!S.security.pinHash, trashN = S.notes.filter(n => n.deletedAt).length;
  el.innerHTML = `<div class="appbar"><button class="ib" data-a="back">${ic('back')}</button><h1>Ayarlar</h1></div><div class="body">
    <div class="sh">KİLİT</div>
    <div class="srow" data-a="pin">${ic('pinpad')}<div>${hasPin ? "PIN'i değiştir" : 'PIN belirle'}<small>Kilitli notları açmak için</small></div></div>
    <div class="srow off">${ic('finger')}<div>Parmak izi / yüz tanıma<small>Android ve iOS uygulamasında kullanılır</small></div></div>
    ${hasPin ? `<div class="srow" data-a="unpin">${ic('lockopen')}<div>PIN'i kaldır</div></div>` : ''}
    <div class="sh">YEDEKLEME</div>
    <div class="srow" data-a="backup">${ic('backup')}<div>Yedek oluştur<small>Tüm notlar ve görseller tek dosyada (uygulamaya da yüklenebilir)</small></div></div>
    <div class="srow" data-a="restore">${ic('upload')}<div>Yedeği geri yükle<small>Var olan notlar korunur, yedektekiler eklenir</small></div></div>
    <div class="srow" data-a="md">${ic('zip')}<div>Markdown olarak dışa aktar<small>Obsidian'da açılabilen .zip (çizimler .png olur)</small></div></div>
    <div class="sh">VERİLER</div>
    <div class="srow" data-a="trash">${ic('delete')}<div>Çöp kutusu</div><span style="color:var(--muted)">${trashN}</span></div>
    <div class="srow off">${ic('info')}<div>Sketchmind<small>${live().length} not · sürüm 1.1.0 · web önizlemesi</small></div></div>
    <p style="color:var(--muted);font-size:12px;padding:8px 20px 32px">Not: Kilit, notların uygulama içinde açılmasını engeller; veriler şifrelenmeden saklanır.</p>
    <input type="file" accept=".json,.sketchmind,application/json" hidden></div>`;
  const inp = el.querySelector('input[type=file]'); inp.onchange = () => inp.files[0] && importBackup(inp.files[0]);
  const busy = async job => { const p = document.createElement('div'); p.className = 'progress'; p.innerHTML = '<div><b>Hazırlanıyor…</b></div>'; el.appendChild(p);
    try { await job(); } catch (e) { toast('Olmadı: ' + (e.message || e)); } finally { p.remove(); } };
  const guard = then => live().some(n => n.locked) ? ensureUnlocked(then) : then();
  el.onclick = e => {
    const a = e.target.closest('[data-a]')?.dataset.a;
    if (a === 'back') pop();
    if (a === 'pin') { const go = () => pinDialog(true, ok => { if (ok) { toast('PIN kaydedildi'); render(); } }); hasPin ? ensureUnlocked(go) : go(); }
    if (a === 'unpin') ensureUnlocked(() => { if (live().some(n => n.locked)) return toast('Önce tüm notların kilidini kaldır'); delete S.security.pinHash; save(); render(); toast('PIN kaldırıldı'); });
    if (a === 'backup') guard(() => busy(exportBackup));
    if (a === 'restore') inp.click();
    if (a === 'md') guard(() => busy(exportMarkdown));
    if (a === 'trash') push({name: 'trash'});
  };
}

// ------------------------------------------------------------------ sekmeler
function renderTabs(el) {
  const tabs = S.tabs.map(byId).filter(Boolean).reverse(), act = S.tabs[S.tabs.length - 1];
  el.innerHTML = `<div class="appbar"><button class="ib" data-a="back">${ic('back')}</button><h1>Sekmeler</h1>${tabs.length ? '<button class="btn" data-a="closeall">Tümünü kapat</button>' : ''}</div>
    <div class="body">${tabs.length ? `<div class="tabsgrid">${tabs.map(n => `<div class="tabc" data-id="${n.id}"><div class="tb ${n.id === act ? 'on' : ''}">
      ${n.pinned ? `<span class="pn">${ic('pin')}</span>` : ''}<button class="ib x" data-close="${n.id}">${ic('close')}</button>
      <div class="prev">${previewHtml(n)}</div></div><div class="nm">${esc(disp(n))}</div></div>`).join('')}</div>` : '<div class="center">Açık sekme yok</div>'}</div>
    <div class="tabsbar"><button class="ib" data-a="new">${ic('add')}</button><div class="c">${tabs.length} sekme</div><button class="btn" data-a="back" style="font-size:16px;font-weight:700">Tamam</button></div>`;
  paintThumbs(el);
  el.onclick = e => {
    const a = e.target.closest('[data-a]')?.dataset.a, x = e.target.closest('[data-close]'), t = e.target.closest('.tabc');
    if (a === 'back') return pop();
    if (a === 'closeall') { S.tabs = []; save(); return render(); }
    if (a === 'new') return newNoteSheet();
    if (x) { S.tabs = S.tabs.filter(id => id !== x.dataset.close); save(); return render(); }
    if (t) { stack.pop(); openNote(byId(t.dataset.id)); }
  };
}

window.addEventListener('keydown', e => { if (e.key === 'Escape') { const l = phone.querySelector('.scrim,.dialog'); if (l) l.remove(); else if (stack.length > 1) pop(); } });
window.addEventListener('resize', () => { if (curRoute().name !== 'text' || !curRoute().edit) render(); });
render();
</script>
