name: sketchmind
description: "Obsidian'ın bağlantılı notları ile Squid'in el yazısı sayfalarını birleştiren not uygulaması."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  path_provider: ^2.1.4
  crypto: ^3.0.6
  image_picker: ^1.1.2
  file_picker: ">=8.3.7 <11.0.0"
  printing: ^5.13.4
  local_auth: ^2.3.0
  share_plus: ">=10.1.4 <12.0.0"
  archive: ">=3.6.1 <5.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1B1B22"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
